<!--Constructor in JavaScript-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function Student(first, last, city, pin) {
            this.first = first;
            this.last = last;
            this.city = city;
            this.pin = pin;
            this.salary = function() {
                document.write("Salary is $10,000");
            };
            this.subject = ["Web Deveplopment", "JavaScript", "HTML", "CSS"];
        }

        let student1 = new Student("John", "Doe", "New York", 10001);
        console.log(student1.first);
        console.log(student1.last);
        student1.salary();
        console.log(student1.subject[0]);
        console.log(student1.subject[1]);

        let student2 = new Student("Kethe", "Lopez", "Los Angeles", 90001);
        console.log(student2.first);
        console.log(student2.last);
        student2.salary();
        console.log(student2.subject[0]);
        console.log(student2.subject[1]);
    </script>
    
</body>
</html>
