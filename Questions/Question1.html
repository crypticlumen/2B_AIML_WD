<body>
    <script>
        class student{
            static count = 0;
            constructor(rollNo, name, marks){
                this.rollNo = rollNo;
                this.name = name;
                this.marks = marks;

                student.count++;
            }
            display(){
                console.log(this.rollNo);
                console.log(this.name);
                console.log(this.marks);

                if(this.marks >= 30){
                    console.log("Pass");
                }
                else{
                    console.log("Fail");
                }
            }
        }

        let s1 = new student(101, "Ram", 90);
        let s2 = new student(101, "Bob", 80);
        let s3 = new student(101, "Alice", 28);

        s1.display();
        s2.display();
        s3.display();

        console.log(student.count)



    </script>
