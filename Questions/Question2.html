<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Bankaccount{
            constructor(accountNo, name, balance){
                this.accountNo = accountNo;
                this.name = name;
                this.balance = balance;
            }
            deposit(amount){
                this.balance += amount;
                console.log(`Deposited ${amount}. New balance is ${this.balance}`);
            }
            withdraw(amount){
                if(this.balance >= amount){
                    this.balance -= amount;
                    console.log(`Withdrew ${amount}. New balance is ${this.balance}`);
                } else {
                    console.log(`Insufficient balance. Current balance is ${this.balance}`);
                }
            }
            displayBalance(){
                console.log(`Account No: ${this.accountNo}, Name: ${this.name}, Balance: ${this.balance}`);
            }
            static bankinfo(){
                console.log("Bank Name: ABC Bank");
                console.log("Banking Info: "); 
            }
        }
        let account1 = new Bankaccount(12345, "John Doe", 1000);
        let account2 = new Bankaccount(67890, "Jane Smith", 500);

        Bankaccount.bankinfo();

        account1.deposit(25890);
        account1.withdraw(1000);
        displayBalance(account1);

        account2.deposit(590000);
        account2.withdraw(10000);
        displayBalance(account2);
    </script>
    
</body>
</html>
