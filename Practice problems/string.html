<!--- Strings ----->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let name = "Vikas Choudhary";

        let b = name.split(" ");
        document.write(b);document.write("<br>");

        let c = name.toUpperCase();
        document.write(c);
        document.write("<br>");

        let d = name.toLowerCase();
        document.write(d);
        document.write("<br>");

        let e = name.charAt(3);
        document.write(e);
        document.write("<br>");

        let f = name.indexOf("k");
        document.write(f);
        document.write("<br>");

        let g = name.lastIndexOf("a")
        document.write(g);
        document.write("<br>");

        let h = name.replace("Vikas", "Vicky");
        document.write(h);
        document.write("<br>");

        let i = name.includes("Choudhary");
        document.write(i);
        document.write("<br>");

        let j = name.startsWith("Vikas");
        document.write(j);
        document.write("<br>");

        let k = name.endsWith("Choudhary");
        document.write(k);
        document.write("<br>");

        let l = name.trim();
        document.write(l);
        document.write("<br>");

    </script>
</body>
</html>
